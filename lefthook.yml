# Pre-commit runs fast file checks; pre-push runs the exhaustive local CI mirror.

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      # The desktop solution config requires build mode to follow references.
      run: pnpm --filter @sitecmd/desktop exec tsc -b
    eslint:
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm exec eslint {staged_files}
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,md,yml,yaml}"
      # Format and re-stage the complete file, including partially staged files.
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    cargo-fmt:
      root: "apps/desktop/src-tauri/"
      glob: "*.rs"
      # rustfmt expects paths relative to root, so strip the app manifest prefix
      run: cargo fmt --check -- {staged_files}
    gitleaks:
      # CI still enforces gitleaks when it is unavailable locally.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --no-banner
        else
          echo "gitleaks not installed; skipping (install via 'brew install gitleaks')"
        fi

commit-msg:
  commands:
    message-format:
      run: node tools/scripts/check-commit-message.mjs --file "{1}"
    budget-ratchet:
      # Budget raises require `[budget-raised: <reason>]` in the commit message;
      # CI repeats the check over the merge range.
      run: node tools/scripts/check-budget-ratchet.mjs --staged

pre-push:
  # A push connects to GitHub before this hook runs, and GitHub drops a push
  # left idle for about six minutes, so the gate below cannot run inside the
  # push. `pnpm gate` runs it ahead of the push and records the commit; this
  # hook refuses any pushed commit without a record from the last day.
  commands:
    gate-pass:
      use_stdin: true
      run: node tools/scripts/gate-pass.mjs check

gate:
  # Full local mirror of release and pull-request checks.
  commands:
    verify-push:
      run: pnpm verify:push
