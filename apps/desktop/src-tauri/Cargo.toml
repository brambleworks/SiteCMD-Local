[workspace]
members = ["crates/protocol","crates/engine-host","crates/engine-host/standin","crates/runtime","crates/cli"]

resolver = "2"

# Incremental compilation is off because this workspace compiles mostly in
# batch runs (test suites, the verify-push gate, agent lanes) where it saves
# little. Every distinct compile state leaves a session directory that cargo
# never reclaims, which reached 269 directories and 47 GB in five days.
[profile.dev]
incremental = false

# Optimize the compiler used by the engine build script and Wasm tests.
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

# Named overrides also apply when these packages are build dependencies.
[profile.release.package.cranelift-assembler-x64]
opt-level = 3

[profile.release.package.cranelift-codegen]
opt-level = 3

[profile.release.package.cranelift-frontend]
opt-level = 3

[profile.release.package.cranelift-entity]
opt-level = 3

[profile.release.package.cranelift-bforest]
opt-level = 3

[profile.release.package.cranelift-control]
opt-level = 3

[profile.release.package.cranelift-bitset]
opt-level = 3

[profile.release.package.regalloc2]
opt-level = 3

[profile.release.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.release.package.wasmtime-environ]
opt-level = 3

[profile.release.package.wasmparser]
opt-level = 3

# Scaling tests repeatedly mask 64 and 256 KiB inputs; optimize regex matching
# to keep those runs practical while retaining test assertions.
[profile.test.package.regex]
opt-level = 3

[profile.test.package.regex-automata]
opt-level = 3

[profile.test.package.aho-corasick]
opt-level = 3

[profile.test.package.memchr]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = false

# Optimize the hosted runtime and turn panics into clean traps.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release.package.sitecmd-protocol]
opt-level = "s"

[profile.wasm-release.package.psl]
opt-level = "s"
