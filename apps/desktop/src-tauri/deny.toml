# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
# Cover the current desktop and CLI release targets.
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]
# Vet the full feature surface: the cargo-deny-action runs with
# --all-features, so the local check must resolve the same graph or the two
# disagree about optional dependencies (e.g. headless_chrome via `browser`).
all-features = true
no-default-features = false

[advisories]
version = 2
# Block vulnerabilities and yanks; limit unmaintained checks to direct dependencies.
yanked = "deny"
unmaintained = "workspace"
# Keep justified exceptions synchronized with the cargo-audit allowlist.
ignore = []

[licenses]
version = 2
# Accepted dependency licenses; copyleft licenses require a scoped exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",     # webpki-roots (Mozilla CA bundle)
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-license-exception = "deny"
# Exclude workspace-private crates, not third-party dependencies.
private = { ignore = true }
exceptions = [
    # auto_generate_cdp declares no license in its crate metadata and ships
    # only a GPL-3.0 LICENSE.txt, which newer cargo-deny synthesizes into
    # GPL-3.0-or-later. It is a build-script code generator pulled in by
    # headless_chrome; it runs at build time and is never linked into or
    # distributed with SiteCMD binaries. Reviewed 2026-08-22.
    { allow = ["GPL-3.0-or-later"], name = "auto_generate_cdp" },
]

# Pin the license expression so every cargo-deny version resolves this crate
# identically (older versions find no license at all; newer versions synthesize
# one from LICENSE.txt). The exception above is what actually permits it.
[[licenses.clarify]]
name = "auto_generate_cdp"
expression = "GPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path crates have no registry version; registry wildcards remain denied.
allow-wildcard-paths = true
deny = [
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
