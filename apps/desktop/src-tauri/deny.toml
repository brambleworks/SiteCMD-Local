# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
# Cover desktop, CLI and hosted WebAssembly release targets.
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]
# Vet the full feature surface: the cargo-deny-action runs with
# --all-features, so the local check must resolve the same graph or the two
# disagree about optional dependencies.
all-features = true
no-default-features = false

[advisories]
version = 2
# Block vulnerabilities and yanks; limit unmaintained checks to direct dependencies.
yanked = "deny"
unmaintained = "workspace"
# Keep justified exceptions synchronized with the cargo-audit allowlist.
ignore = []

[licenses]
version = 2
# Accepted dependency licenses; copyleft licenses require a scoped exception.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",     # webpki-root-certs on supported targets
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.9
exceptions = []
unused-license-exception = "deny"
# Exclude workspace-private crates, not third-party dependencies.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path crates have no registry version; registry wildcards remain denied.
allow-wildcard-paths = true
deny = [
    { name = "chrono", reason = "Unmaintained in RUSTSEC-2026-0543. Use jiff." },
    { name = "wasmtime-wasi", reason = "The engine module has no WASI capabilities." },
    { name = "wasi-common", reason = "The engine module has no WASI capabilities." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
