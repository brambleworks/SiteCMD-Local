[package]
name = "sitecmd-runtime"
version = "2.0.0"
description = "Shared network transport, persistence, and CLI runtime"
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.95.0"

[lib]
# Keep established source paths while separating compilation and dependency ownership.
path = "../../src/runtime.rs"

[features]
default = []
test-support = ["tokio/test-util"]

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
sitecmd-engine-host = { path = "../engine-host" }
sitecmd-protocol = { path = "../protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Route tracing through the CLI's log facade.
tracing = { version = "0.1", features = ["log"] }
# `gzip`/`brotli` let ordinary traffic negotiate response compression; the
# limited body readers count decoded bytes so the caps still bound what a
# compressed response may expand into. `deflate` and `zstd` stay off: origins
# implement deflate inconsistently, and zstd would add a C library to the build.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "cookies",
    "form",
    "query",
    "charset",
    "http2",
    "system-proxy",
    "gzip",
    "brotli",
] }
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.4"
moka = { version = "0.12", features = ["sync"] }
regex = "1"
# Gitignore matching only; Code Scan retains its bounded filesystem walker.
ignore = "0.4"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
# Parse OSV CVSS v3 and v4 vectors into the canonical severity vocabulary.
cvss = "2.2"
thiserror = "2"
# TLS validation for the shared HTTP clients.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
postgres = "0.19"
tempfile = "3"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
sha2 = "0.11"
hex = "0.4.3"
# Direct dependency because connection-export encryption is a security boundary.
ring = "0.17"
zeroize = "1"
libc = "0.2"
# Keeps the CLI's Connect token in the OS keychain; each platform's store is its own crate.
keyring-core = "1.0.1"
# Seals a repository secret to GitHub's public key, as GitHub's secrets API requires.
crypto_box = { version = "0.9.1", features = ["seal"] }
similar = "3"
icu_properties = "2"
htmlize = { version = "1", features = ["unescape"] }
aho-corasick = "1"
percent-encoding = "2"
unicode-normalization = "0.1"
unicode-security = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
flate2 = "1"
tokio = { version = "1", features = ["test-util"] }
