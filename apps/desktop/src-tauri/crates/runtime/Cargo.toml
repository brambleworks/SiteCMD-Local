[package]
name = "sitecmd-runtime"
version = "1.3.0"
description = "Shared native scan, persistence, and CLI runtime"
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.89.0"

[lib]
# Keep established source paths while separating compilation and dependency ownership.
path = "../../src/runtime.rs"

[features]
default = []
test-support = []
browser = ["dep:headless_chrome"]

[dependencies]
# Portable scan engine shared with the hosted runner; `ts` adds IPC bindings.
sitecmd-engine = { path = "../engine", features = ["browser-payload", "ts"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Generates the canonical TypeScript IPC bindings during the default test suite.
ts-rs = "12"
log = "0.4"
# Route tracing through the log facade and Tauri's configured sinks.
tracing = { version = "0.1", features = ["log"] }
# `gzip`/`brotli` let ordinary traffic negotiate response compression; the
# limited body readers count decoded bytes so the caps still bound what a
# compressed response may expand into. `deflate` and `zstd` stay off: origins
# implement deflate inconsistently, and zstd would add a C library to the build.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "cookies",
    "form",
    "query",
    "charset",
    "http2",
    "system-proxy",
    "gzip",
    "brotli",
] }
tokio = { version = "1", features = ["full"] }
thread-priority = "3"
url = { version = "2", features = ["serde"] }
futures-util = "0.3"
getrandom = "0.4"
urlencoding = "2"
open = "5"
moka = { version = "0.12", features = ["sync"] }
regex = "1"
# Gitignore matching only; Code Scan retains its bounded filesystem walker.
ignore = "0.4"
shlex = "2"
chrono = { version = "0.4", features = ["serde"] }
# Parse OSV CVSS v3 and v4 vectors into the canonical severity vocabulary.
cvss = "2.2"
thiserror = "2"
async-trait = "0.1"
# Pure Rust TLS stack for async requests and synchronous certificate checks.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
rustls-platform-verifier = "0.7"
x509-parser = "0.18"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
postgres = "0.19"
tempfile = "3"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
hostname = "0.4.2"
whoami = "2.1.1"
# Keep webhook signing on stable RustCrypto releases and verify bumps against reference vectors.
hmac = "0.13"
minisign-verify = "0.2.5"
sha2 = "0.11"
hex = "0.4.3"
# Direct dependency because connection-export encryption is a security boundary.
ring = "0.17"
zeroize = "1"
libc = "0.2"
headless_chrome = { version = "1", optional = true }
# Resolves non-address DNS records used by the security checks.
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["test-util"] }
