[package]
name = "sitecmd-engine-host"
version = "2.0.0"
description = "Host boundary for the SiteCMD engine module"
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.95.0"

[features]
compile = ["wasmtime/cranelift"]

[dependencies]
hex = "0.4"
sitecmd-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "std"] }

[build-dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
wasmtime = { version = "=48.0.10", default-features = false, features = ["cranelift", "std", "all-arch"] }

[dev-dependencies]
wasmtime = { version = "=48.0.10", default-features = false, features = ["cranelift"] }
wat = "1.248"
