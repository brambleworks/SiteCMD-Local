[package]
name = "sitecmd-cli"
version = "1.3.0"
description = "Headless SiteCMD CLI for Web Scan, Code Scan, and connected CI/CD"
authors = ["Kyle Piontek (Brambleworks LLC)"]
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.89.0"

[features]
default = []
browser = ["sitecmd-runtime/browser"]

[[bin]]
name = "sitecmd_cli"
path = "src/main.rs"

[dependencies]
sitecmd-runtime = { path = "../runtime" }
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
