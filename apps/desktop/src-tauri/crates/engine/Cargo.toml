[package]
name = "sitecmd-engine"
version = "0.1.0"
description = "Portable SiteCMD scan-engine surface: scoring vocabulary, dedup, and the canonical health-score calculator, compiled natively (desktop, CLI) and to wasm (hosted runner)"
authors = ["Kyle Piontek (Brambleworks LLC)"]
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.89.0"

[features]
default = []
# Optional TypeScript derives for the desktop IPC boundary.
ts = ["dep:ts-rs"]
# Embed axe-core for desktop and CLI injection; the hosted runner supplies it separately.
browser-payload = []

[dependencies]
# Disable ambient clocks so callers must provide evaluation time.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# Matches reqwest's HeaderMap without introducing reqwest into the engine.
http = "1"
memchr = "2.8.3"
psl = "2"
quick-xml = "0.41"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Canonical capability-manifest and document digests across runtimes.
sha2 = "0.11"
# Keyed fingerprints prevent dictionary recovery of low-entropy code locations.
hmac = "0.13"
hex = "0.4"
ts-rs = { version = "12", optional = true }
url = "2"
# Shared leaf-certificate parser for native and wasm TLS facts.
x509-parser = "0.18"
