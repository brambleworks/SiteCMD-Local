<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>API keys</title></head>
<body>
<!-- A settings page that names Stripe's restricted key prefix in prose and in a field hint, as vendor documentation and dashboards do. Not a key. -->
<h1>API keys</h1>
<p>Restricted keys start with <code>rk_live_</code> in live mode and <code>rk_test_</code> in test mode.</p>
<label for="restricted">Restricted key</label>
<input id="restricted" name="restricted" placeholder="rk_live_...">
<p class="hint">Paste the key that starts with rk_live_ here. We never show it again.</p>
</body>
</html>
