[package]
name = "sitecmd-engine-wasm"
version = "0.1.0"
description = "C-ABI wasm artifact for the portable SiteCMD scorer and severity policy, with optional check evaluation for hosted scans"
authors = ["Kyle Piontek (Brambleworks LLC)"]
license = "Apache-2.0"
publish = false
edition = "2021"
rust-version = "1.89.0"

[lib]
# `rlib` lets native tests exercise the exported wasm ABI.
crate-type = ["cdylib", "rlib"]

[features]
# The default artifact contains the scorer and severity policy and is byte-pinned downstream.
default = []
# Include the check tree and evaluation ABI for the scan worker artifact.
checks = []

[dependencies]
# Exclude desktop-only TypeScript and browser-payload features.
sitecmd-engine = { path = "../engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Enable the checks ABI in ordinary workspace tests without changing release defaults.
sitecmd-engine-wasm = { path = ".", features = ["checks"] }
