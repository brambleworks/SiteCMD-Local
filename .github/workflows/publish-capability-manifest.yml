# Register capability digests from main before builds can emit observations under them.
name: Publish capability manifest

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/src-tauri/crates/engine/manifest/capability_manifest.json"
      - "tools/scripts/publish-capability-manifest.mjs"
      - ".github/workflows/publish-capability-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read
  # The registry accepts only GitHub Actions OIDC.
  id-token: write

jobs:
  publish:
    name: Publish manifest to the connect registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # The publisher needs no dependency installation.
      - name: Publish capability manifest
        run: node ./tools/scripts/publish-capability-manifest.mjs
