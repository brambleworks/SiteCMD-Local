name: rust-msrv

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/rust-msrv.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-msrv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust 1.89 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Provide the mcp-server resource path
        run: mkdir -p apps/mcp-server/dist-bundle

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89.0

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: msrv-1.89

      - name: Check desktop workspace at the declared MSRV
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --workspace --all-targets

      - name: Check the headless CLI at the declared MSRV
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked --manifest-path crates/cli/Cargo.toml --all-targets
