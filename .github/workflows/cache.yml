name: Warm CI dependency caches

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/rust-toolchain.toml"
      - "**/.cargo/config.toml"
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  warm:
    name: Warm Rust and pnpm caches
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Free Linux runner disk for both Rust profiles
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Compile test-profile dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked --workspace --tests --profile test
      - name: Compile release-profile dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked --workspace --release

  warm-engine-pin:
    name: Warm engine pin dependencies (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            prefix: engine-pin-macos-26
          - os: ubuntu-22.04
            prefix: engine-pin-ubuntu-22.04
          - os: ubuntu-22.04-arm
            prefix: engine-pin-ubuntu-22.04-arm
          - os: windows-2025-vs2026
            prefix: engine-pin-windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          prefix-key: ${{ matrix.prefix }}
          shared-key: engine-pin
      - name: Use the runner CPU count
        run: echo "CARGO_BUILD_JOBS=$(node -p 'require("node:os").availableParallelism()')" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Compile release dependencies for the headless CLI
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --locked --manifest-path crates/cli/Cargo.toml
