name: Weekly dependency advisories

on:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-dependency-advisories
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.19.4
      - name: Audit Rust dependency advisories
        if: ${{ !cancelled() }}
        env:
          SITECMD_RUST_AUDIT_FETCH: "1"
        run: pnpm run audit:deps:rust
      - name: Audit JavaScript dependency advisories
        if: ${{ !cancelled() }}
        run: pnpm run audit:deps:js
      - name: Audit updater signer advisories
        if: ${{ !cancelled() }}
        run: pnpm run audit:deps:signer
      - name: Check Rust advisory policy
        if: ${{ !cancelled() }}
        working-directory: apps/desktop/src-tauri
        run: cargo deny --all-features check advisories

  report:
    needs: audit
    if: failure() && needs.audit.result == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the dependency advisory issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-advisory-failure.sh
