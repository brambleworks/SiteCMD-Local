name: Code Scan

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-guardrails-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit repository code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # Tauri validates the configured MCP resource path during CLI builds.
      - name: Provide the MCP resource path
        run: mkdir -p apps/mcp-server/dist-bundle

      - name: Build Code Scan audit binary
        run: cargo build --manifest-path apps/desktop/src-tauri/crates/cli/Cargo.toml

      - name: Run Code Scan audit
        id: guardrails
        shell: bash
        run: |
          set +e
          apps/desktop/src-tauri/target/debug/sitecmd_cli audit . --format github --fail-on high > guardrails-annotations.txt
          audit_status=$?
          set -e
          if [[ "$audit_status" -gt 1 ]]; then
            echo "Code Scan failed before it could evaluate the severity threshold (exit $audit_status)." >&2
            exit "$audit_status"
          fi
          apps/desktop/src-tauri/target/debug/sitecmd_cli audit . --format summary --output guardrails-summary.txt
          cat guardrails-annotations.txt
          apps/desktop/src-tauri/target/debug/sitecmd_cli audit . --format review --output guardrails-review.md
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish review summary
        if: steps.guardrails.outcome == 'success'
        shell: bash
        run: |
          {
            echo "## SiteCMD Code Scan"
            echo ""
            cat guardrails-summary.txt
            echo ""
            echo "Full review: \`app-guardrails-review\` artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-guardrails-review
          path: guardrails-review.md
          if-no-files-found: error

      - name: Fail on high findings
        if: steps.guardrails.outputs.status != '0'
        run: exit 1
