name: dependency-audit

# Audit changed dependency trees immediately and unchanged trees weekly.
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/desktop/package.json"
      - "apps/mcp-server/package.json"
      - ".github/updater-signer/package.json"
      - ".github/updater-signer/package-lock.json"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/deny.toml"
      - "THIRD_PARTY_DEPENDENCIES.json"
      - "tools/scripts/check-javascript-licenses.mjs"
      - "tools/scripts/lib/javascript-license-policy.mjs"
      - "tools/scripts/audit-rust-deps.mjs"
      - ".github/workflows/dependency-audit.yml"
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # Watch every workspace manifest.
      - "apps/desktop/package.json"
      - "apps/mcp-server/package.json"
      # The updater signer is outside the pnpm graph.
      - ".github/updater-signer/package.json"
      - ".github/updater-signer/package-lock.json"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/deny.toml"
      - "THIRD_PARTY_DEPENDENCIES.json"
      - "tools/scripts/check-javascript-licenses.mjs"
      - "tools/scripts/lib/javascript-license-policy.mjs"
      - "tools/scripts/audit-rust-deps.mjs"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    # Mondays at 12:00 UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny check ${{ matrix.checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check ${{ matrix.checks }}

  advisories:
    name: JavaScript + Rust dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependency advisories
        run: pnpm run audit:deps:js

      - name: Audit JavaScript dependency licenses
        run: pnpm run audit:licenses:js

      # Audit the signer's pinned tree without installing it.
      - name: Audit the updater signer's dependency tree
        run: pnpm run audit:deps:signer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-audit

      - name: Audit Rust dependency advisories
        env:
          SITECMD_RUST_AUDIT_FETCH: "1"
        run: pnpm run audit:deps:rust
