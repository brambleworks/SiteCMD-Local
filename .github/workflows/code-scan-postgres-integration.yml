name: Code Scan Postgres Integration

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/src/core/code_scan/**"
      - "apps/desktop/src-tauri/src/core/database_targets.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/rust-toolchain.toml"
      - ".github/workflows/code-scan-postgres-integration.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/src/core/code_scan/**"
      - "apps/desktop/src-tauri/src/core/database_targets.rs"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/rust-toolchain.toml"
      - ".github/workflows/code-scan-postgres-integration.yml"
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-scan-postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-live:
    name: Localhost Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      SITECMD_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri requires the declared MCP resource path even for compile-only jobs.
      - name: Provide the mcp-server resource path
        run: mkdir -p apps/mcp-server/dist-bundle

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            postgresql-client

      - name: Wait for Postgres service
        shell: bash
        run: |
          for _ in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres service did not become ready in time."
          exit 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Run ignored localhost Postgres integration tests
        run: cargo test -p sitecmd-runtime --manifest-path apps/desktop/src-tauri/Cargo.toml postgres_live -- --ignored --nocapture
