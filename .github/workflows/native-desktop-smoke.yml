name: native-desktop-smoke

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mcp-server/**"
      - "tools/scripts/native-desktop-smoke.mjs"
      - "tools/scripts/lib/native-webdriver.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/native-desktop-smoke.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Native desktop and MCP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev xvfb dbus-x11
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Build contributor desktop and bundled MCP
        run: pnpm --filter @sitecmd/desktop exec tauri build --debug --no-bundle --config src-tauri/tauri.contributor.conf.json
      - name: Exercise the native app
        run: xvfb-run -a dbus-run-session -- pnpm e2e:native
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-desktop-smoke
          path: |
            .artifacts/native-smoke/**/result.json
            .artifacts/native-smoke/**/desktop.log
          retention-days: 14
