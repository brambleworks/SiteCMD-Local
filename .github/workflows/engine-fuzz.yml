name: engine-fuzz

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/crates/engine/**"
      - "apps/desktop/src-tauri/crates/engine-fuzz/**"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "tools/scripts/seed-engine-fuzz.mjs"
      - ".github/workflows/engine-fuzz.yml"
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "29 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly-2026-09-01
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-09-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Seed the checked-in scanner corpus
        run: node tools/scripts/seed-engine-fuzz.mjs
      - name: Fuzz all input boundaries
        working-directory: apps/desktop/src-tauri
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: |
          for target in page_input sitemap_input evaluation_payload; do
            cargo +nightly-2026-09-01 fuzz run --fuzz-dir crates/engine-fuzz --features fuzzing "$target" -- -max_total_time="$FUZZ_SECONDS" -max_len=65536 -timeout=10 -rss_limit_mb=2048
          done
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-fuzz-crashes
          path: apps/desktop/src-tauri/crates/engine-fuzz/artifacts/
          retention-days: 30
