name: cargo-clippy

# Hosted Linux clippy covers cfg branches unavailable to the local macOS gate.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/cargo-clippy.yml"
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/cargo-clippy.yml"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-clippy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri requires the declared MCP resource path even for compile-only jobs.
      - name: Provide the mcp-server resource path
        run: mkdir -p apps/mcp-server/dist-bundle

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --no-deps --workspace --all-targets -- -D warnings

      - name: Run headless CLI clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --no-deps --manifest-path crates/cli/Cargo.toml --all-targets -- -D warnings

      - name: Run rustfmt check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check --all

      # Forbids ad-hoc reqwest clients and raw .to_string() error mappings.
      # Shared with verify-push.mjs so the local and CI checks never drift.
      - name: Forbid ad-hoc reqwest clients and raw error .to_string()
        run: bash tools/scripts/audit/forbid-adhoc-rust-patterns.sh
