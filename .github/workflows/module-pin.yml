name: Verify the engine pin

on:
  pull_request:
  push:
    branches: [main]
    paths: [engine.lock]

permissions:
  contents: read

env:
  CARGO_PROFILE_TEST_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  verify-pin:
    name: Verify the engine pin (${{ matrix.os }})
    if: >-
      github.repository == 'brambleworks/SiteCMD-Local'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            prefix: engine-pin-macos-26
          - os: ubuntu-22.04
            prefix: engine-pin-ubuntu-22.04
          - os: ubuntu-22.04-arm
            prefix: engine-pin-ubuntu-22.04-arm
          - os: windows-2025-vs2026
            prefix: engine-pin-windows-2025-vs2026
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          prefix-key: ${{ matrix.prefix }}
          shared-key: engine-pin
          save-if: false
      - name: Use the runner CPU count
        run: echo "CARGO_BUILD_JOBS=$(node -p 'require("node:os").availableParallelism()')" >> "$GITHUB_ENV"
      - name: Fetch the pinned engine
        run: pnpm engine:fetch
      - name: Build the pinned CLI
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --locked --manifest-path crates/cli/Cargo.toml
      - name: Verify the embedded pin and log the engine load time
        run: |
          binary=apps/desktop/src-tauri/target/release/sitecmd_cli
          if [ "$RUNNER_OS" = Windows ]; then
            binary+=.exe
          fi
          node tools/scripts/verify-engine-pin.mjs "$binary"
