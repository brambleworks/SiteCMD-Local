name: cargo-machete

# Manually scan for unused Rust dependencies.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-machete-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Detect unused Rust deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-machete

      - name: Run cargo-machete
        working-directory: apps/desktop/src-tauri
        run: cargo machete
