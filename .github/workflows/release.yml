name: Release

# Signed `v*` tags only. Verify, approve, build, isolate updater signing,
# verify without secrets, then publish without a checkout.
# Configuration and recovery: docs/operations/releasing.md

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Cancel superseded runs to avoid duplicate platform-build spend.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-gate:
    name: Tag verification
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Keep tag trust outside the commit being authenticated.
    environment: release-tag-trust
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Enforce strict semver tag pattern
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG_NAME' does not match strict semver pattern vMAJOR.MINOR.PATCH[-prerelease]."
            echo "::error::Release tags must be the only trigger for shipped builds. Retag with the correct format."
            exit 1
          fi

      - name: Require annotated tag (not lightweight)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Checkout peels the local ref, so ask origin for the annotated tag object.
          peeled="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}")"
          if [ -z "$peeled" ]; then
            echo "::error::Tag '$TAG_NAME' is a lightweight tag (origin advertises no peeled object)."
            echo "::error::Re-create as a signed tag: git tag -s $TAG_NAME -m '...' && git push --force-with-lease origin $TAG_NAME"
            exit 1
          fi
          echo "Tag '$TAG_NAME' is annotated (origin advertises a peeled object)."

      - name: Require release tag from the protected default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release commit $RELEASE_COMMIT is not in origin/$DEFAULT_BRANCH."
            echo "::error::Release tags may point only at commits that landed through the protected default branch."
            exit 1
          fi

      - name: Verify signed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          # Trust comes from the protected environment, never the checkout.
          if [ -z "$ALLOWED_SIGNERS" ]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS is not set in the release-tag-trust environment."
            echo "::error::Release tag trust is not configured; see docs/operations/releasing.md."
            exit 1
          fi
          SIGNERS_FILE="$RUNNER_TEMP/allowed-signers"
          REVIEWED_SIGNERS_FILE="$RUNNER_TEMP/reviewed-allowed-signers"
          PROTECTED_SIGNERS_FILE="$RUNNER_TEMP/protected-allowed-signers"
          printf '%s\n' "$ALLOWED_SIGNERS" > "$SIGNERS_FILE"

          normalize_signers() {
            awk '{
              sub(/\r$/, "")
              sub(/[[:space:]]+$/, "")
              if ($0 !~ /^[[:space:]]*(#|$)/) print
            }' "$1"
          }

          normalize_signers .github/allowed-signers > "$REVIEWED_SIGNERS_FILE"
          normalize_signers "$SIGNERS_FILE" > "$PROTECTED_SIGNERS_FILE"
          if [ ! -s "$PROTECTED_SIGNERS_FILE" ]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS contains no signer entries."
            exit 1
          fi
          if ! cmp -s "$REVIEWED_SIGNERS_FILE" "$PROTECTED_SIGNERS_FILE"; then
            echo "::error::RELEASE_ALLOWED_SIGNERS does not match .github/allowed-signers."
            echo "::error::Publish the reviewed file to the release-tag-trust environment before tagging."
            exit 1
          fi

          # Re-fetch the tag object because checkout leaves a peeled local ref.
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          git config --local gpg.ssh.allowedSignersFile "$PROTECTED_SIGNERS_FILE"
          if ! git verify-tag "$TAG_NAME" 2>&1; then
            echo "::error::Tag '$TAG_NAME' is not signed by an allowed signer."
            echo "::error::Re-tag with: git tag -s $TAG_NAME -m '...' && git push --force-with-lease origin $TAG_NAME"
            exit 1
          fi

  # Validate the production updater key before platform builds.
  validate-updater-key:
    name: Validate updater signing secret
    needs: tag-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: release-updater-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/updater-signer
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/updater-signer/package-lock.json

      - name: Provision the integrity-pinned standalone signer
        working-directory: .github/updater-signer
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Sign a probe byte with the production key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing from release-updater-signing."
            exit 1
          fi
          printf 'probe' > "$RUNNER_TEMP/probe.bin"
          "$GITHUB_WORKSPACE/.github/updater-signer/node_modules/.bin/tauri" \
            signer sign "$RUNNER_TEMP/probe.bin"
          test -s "$RUNNER_TEMP/probe.bin.sig"

  # Authenticate the publish key with an invalid, non-mutating request.
  validate-publish-key:
    name: Validate publish credential
    needs: tag-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment:
      name: release-publish
    steps:
      - name: Probe the releases-admin endpoint without publishing
        env:
          RELEASE_ADMIN_KEY: ${{ secrets.RELEASE_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_ADMIN_KEY:-}" ]; then
            echo "::error::RELEASE_ADMIN_KEY is missing from release-publish."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${RELEASE_ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            https://releases.sitecmd.com/api/releases-admin)
          if [ "$status" != "400" ]; then
            echo "::error::Probe expected 400 (authenticated, body rejected) but got $status."
            echo "::error::401 means RELEASE_ADMIN_KEY drifted between GitHub and the releases worker; re-sync both sides and rerun failed jobs."
            exit 1
          fi

  preflight:
    name: Release preflight
    needs: tag-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Remove unused toolchains before the Rust debug target fills the runner.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-audit

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Repository guardrails
        run: pnpm guardrails:repo

      - name: Third-party artifact freshness
        run: pnpm run legal:check

      # Run fast advisory checks before expensive test and build work.
      - name: JavaScript dependency audit
        run: pnpm run audit:deps:js

      - name: Updater signer dependency audit
        run: pnpm run audit:deps:signer

      - name: Rust dependency audit
        env:
          SITECMD_RUST_AUDIT_FETCH: "1"
        run: pnpm run audit:deps:rust

      # MCP tests need dist; direct Tauri builds also require dist-bundle.
      - name: Build and bundle mcp-server (dist/ + dist-bundle/ for knip and tauri-build)
        run: |
          pnpm --filter sitecmd-mcp run build
          pnpm --filter sitecmd-mcp run bundle

      - name: Knip unused-export budget
        run: pnpm run knip:exports-budget

      - name: JavaScript and app tests
        run: pnpm test

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo nextest run --no-fail-fast --workspace --profile ci

      - name: Rust doctests
        working-directory: apps/desktop/src-tauri
        run: cargo test --doc --workspace

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --no-deps --workspace --all-targets -- -D warnings

      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check --all

  # Register the capability digest before any artifact ships under it.
  publish-capability-manifest:
    name: Publish capability manifest to the connect registry
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The registry accepts only a GitHub Actions OIDC token for its audience.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      # The publisher uses only Node builtins and global fetch.
      - name: Publish capability manifest
        run: node ./tools/scripts/publish-capability-manifest.mjs

  prepare-candidate:
    name: Prepare immutable release candidate
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      candidate_hash: ${{ steps.candidate.outputs.candidate_hash }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Build release candidate manifest
        id: candidate
        env:
          TAG_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: bash .github/scripts/release/build-candidate-manifest.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

  build:
    needs:
      [prepare-candidate, validate-updater-key, validate-publish-key, publish-capability-manifest]
    permissions:
      contents: read
    # Require one human approval for all platform builds.
    environment:
      name: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build one universal macOS app; updater and DMG artifacts derive from it.
          - os: macos-latest
            target: darwin-universal
            rust_target: universal-apple-darwin
            rust_toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app
          - os: ubuntu-22.04
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            rust_toolchain_targets: x86_64-unknown-linux-gnu
            bundles: appimage
          # Pin the Windows toolchain instead of following windows-latest.
          - os: windows-2025-vs2026
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            rust_toolchain_targets: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # Bound hung platform builds well below GitHub's default timeout.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-candidate.outputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: release-candidate

      - name: Bind build to the human-reviewed candidate
        env:
          EXPECTED_CANDIDATE_HASH: ${{ needs.prepare-candidate.outputs.candidate_hash }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.prepare-candidate.outputs.source_commit }}
          EXPECTED_VERSION: ${{ needs.prepare-candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          ACTUAL_HASH=$(sha256_file release-candidate/manifest.json)
          test "$ACTUAL_HASH" = "$EXPECTED_CANDIDATE_HASH"
          test "$(jq -r '.source_commit' release-candidate/manifest.json)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(jq -r '.version' release-candidate/manifest.json)" = "$EXPECTED_VERSION"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(sha256_file .github/workflows/release.yml)" = \
            "$(jq -r '.workflow_sha256' release-candidate/manifest.json)"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_toolchain_targets }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install cargo-license
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-license

      - name: Require configured platform signing
        if: matrix.target == 'windows-x86_64' || startsWith(matrix.target, 'darwin')
        env:
          AZURE_TENANT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGN_ENDPOINT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ENDPOINT || '' }}
          AZURE_SIGN_ACCOUNT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ACCOUNT || '' }}
          AZURE_SIGN_PROFILE: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_PROFILE || '' }}
          APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_TEAM_ID || '' }}
          KEYCHAIN_PASSWORD: ${{ startsWith(matrix.target, 'darwin') && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_KEY_P8: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY_P8 || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "windows-x86_64" ]; then
            required="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE"
          else
            required="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID KEYCHAIN_PASSWORD APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8"
          fi
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release-signing configuration: $name"
              exit 1
            fi
          done

      - name: Install artifact-signing-cli (Windows code signing)
        # Tauri invokes this pinned CLI to Authenticode-sign Windows artifacts.
        if: matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ENDPOINT != ''
        run: cargo install artifact-signing-cli --version 0.11.0 --locked

      - name: Verify Azure signing (fail fast with the real error)
        # Probe Azure directly so authentication failures retain their diagnostics.
        if: matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ENDPOINT != ''
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
        run: |
          set -uo pipefail
          cp /c/Windows/System32/whoami.exe sign-probe.exe
          echo "Probing Azure Artifact Signing: ${AZURE_SIGN_ENDPOINT} (${AZURE_SIGN_ACCOUNT}/${AZURE_SIGN_PROFILE})"
          artifact-signing-cli -e "$AZURE_SIGN_ENDPOINT" -a "$AZURE_SIGN_ACCOUNT" -c "$AZURE_SIGN_PROFILE" sign-probe.exe
          status=$?
          rm -f sign-probe.exe
          if [ "$status" -ne 0 ]; then
            echo "::error::Azure signing probe failed (exit $status). The error above is the real cause - check the service-principal client-secret expiry, the Trusted/Artifact Signing 'Certificate Profile Signer' role assignment, and the certificate profile status in the Azure portal."
            exit "$status"
          fi
          echo "Azure signing probe succeeded; bundle signing should work."

      - name: Verify Apple notarization credentials (fail fast with the real error)
        # Probe Apple credentials before compiling; step conditions cannot read secrets.
        if: startsWith(matrix.target, 'darwin')
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -uo pipefail
          if [ -z "${APPLE_API_KEY_P8_B64:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "::error::Apple notarization credentials are required for a production release."
            exit 1
          fi
          key="$RUNNER_TEMP/asc_api_key_probe.p8"
          printf '%s' "$APPLE_API_KEY_P8_B64" | tr -d '\r' | base64 --decode > "$key"
          echo "Probing the Apple notary service with the App Store Connect API key"
          xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" >/dev/null
          status=$?
          rm -f "$key"
          if [ "$status" -ne 0 ]; then
            echo "::error::Apple notary probe failed (exit $status). The error above is the real cause. A 403 'A required agreement is missing or has expired' means the Account Holder must accept the updated agreement at developer.apple.com/account (and App Store Connect > Business > Agreements). Otherwise check APPLE_API_KEY_ID, APPLE_API_ISSUER, and APPLE_API_KEY_P8."
            exit "$status"
          fi
          echo "Apple notary probe succeeded; notarization should work."

      # Product builds receive a throwaway updater key, never the production key.
      # Step-scope embedded commercial configuration to minimize dependency exposure.
      - name: Build Tauri app with ephemeral updater key
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          BUNDLES: ${{ matrix.bundles }}
          SITECMD_REQUIRE_LICENSE_CONFIG: "1"
          SITECMD_LICENSE_STORE_ID: ${{ secrets.SITECMD_LICENSE_STORE_ID }}
          SITECMD_LICENSE_CORE_MONTHLY_VARIANT_ID: ${{ secrets.SITECMD_LICENSE_CORE_MONTHLY_VARIANT_ID }}
          SITECMD_LICENSE_CORE_ANNUAL_VARIANT_ID: ${{ secrets.SITECMD_LICENSE_CORE_ANNUAL_VARIANT_ID }}
          SITECMD_LICENSE_PRO_MONTHLY_VARIANT_ID: ${{ secrets.SITECMD_LICENSE_PRO_MONTHLY_VARIANT_ID }}
          SITECMD_LICENSE_PRO_ANNUAL_VARIANT_ID: ${{ secrets.SITECMD_LICENSE_PRO_ANNUAL_VARIANT_ID }}
          SITECMD_LICENSE_CORE_CHECKOUT_URL: ${{ secrets.SITECMD_LICENSE_CORE_CHECKOUT_URL }}
          SITECMD_LICENSE_PRO_CHECKOUT_URL: ${{ secrets.SITECMD_LICENSE_PRO_CHECKOUT_URL }}
          # Desktop OAuth credentials are embedded in the app; Google also uses PKCE.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.SITECMD_GITHUB_CLIENT_ID }}
          # Public connected-service configuration embedded by Rust.
          SITECMD_CONNECTED_ENDPOINT: "https://connect.sitecmd.com"
          # Public telemetry configuration; registration derives from the events URL.
          VITE_SITECMD_TELEMETRY_ENDPOINT: "https://telemetry.sitecmd.com/v1/events"
          VITE_SITECMD_SENTRY_DSN: ${{ secrets.SITECMD_SENTRY_DSN }}
          # Pin generated CI workflows to this release's source commit.
          SITECMD_SOURCE_COMMIT: ${{ needs.prepare-candidate.outputs.source_commit }}
          # Catalog endpoints use their own public verification key, not the updater key.
          SITECMD_ACTIVATION_ENDPOINT: "https://activation.sitecmd.com"
          SITECMD_CATALOG_ENDPOINT: "https://catalog.sitecmd.com"
          SITECMD_CATALOG_PUBLIC_KEY: "RWSeaBe56eW7X37YY7J9FJqovuvJ0m5Zl4gyoXkEtJJobN8gAIDLbLwq"
          # Scope Azure credentials to the Windows leg.
          AZURE_TENANT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGN_ENDPOINT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ENDPOINT || '' }}
          AZURE_SIGN_ACCOUNT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ACCOUNT || '' }}
          AZURE_SIGN_PROFILE: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_PROFILE || '' }}
          # Scope Developer ID and notarization credentials to macOS legs.
          APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          KEYCHAIN_PASSWORD: ${{ startsWith(matrix.target, 'darwin') && secrets.KEYCHAIN_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_KEY_PATH: ${{ startsWith(matrix.target, 'darwin') && format('{0}/asc_api_key.p8', runner.temp) || '' }}
          APPLE_API_KEY_P8_B64: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_API_KEY_P8 || '' }}
        shell: bash
        run: bash .github/scripts/release/build-tauri-app.sh
      # Reject artifacts containing the throwaway private-key marker.
      - name: Verify signing key not embedded in artifacts
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="apps/desktop/src-tauri/target/${RUST_TARGET}/release/bundle"
          if grep -rIl 'untrusted comment: minisign encrypted secret key' "$BUNDLE_DIR" 2>/dev/null; then
            echo "::error::Tauri signing private key marker found in release bundle." >&2
            exit 1
          fi

      # dmgbuild writes the DMG layout deterministically without Finder.
      - name: Restyle macOS DMG (deterministic, Finder-free)
        if: startsWith(matrix.target, 'darwin')
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Reuse the staged App Store Connect key for the DMG.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: bash .github/scripts/release/build-macos-dmg.sh
      # Require the baked DMG layout and background art.
      - name: Verify DMG layout baked
        if: startsWith(matrix.target, 'darwin')
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/${RUST_TARGET}/release/bundle"
          DMG=$(find "$BUNDLE/dmg" -name '*.dmg' -print -quit)
          MP=$(mktemp -d)
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MP" >/dev/null
          fail=0
          [ -f "$MP/.DS_Store" ]      || { echo "::error::DMG has no .DS_Store - window layout did not bake"; fail=1; }
          ls "$MP"/.background* >/dev/null 2>&1 || { echo "::error::DMG has no background art"; fail=1; }
          [ -d "$MP/SiteCMD.app" ]    || { echo "::error::DMG missing SiteCMD.app"; fail=1; }
          [ -L "$MP/Applications" ]   || { echo "::error::DMG missing Applications symlink"; fail=1; }
          hdiutil detach "$MP" >/dev/null || hdiutil detach "$MP" -force >/dev/null
          # A signed DMG must also be notarized and stapled.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            xcrun stapler validate "$DMG" || { echo "::error::DMG is not notarized/stapled"; fail=1; }
          fi
          if [ "$fail" -eq 0 ]; then echo "DMG verified: styled layout + app + Applications (+ notarized when signed)"; fi
          exit "$fail"

      - name: Locate updater bundle and signature
        id: bundle
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
        shell: bash
        run: bash .github/scripts/release/locate-updater-bundle.sh
      # Build the headless CLI as a separate, desktop-feature-free package.
      - name: Build CLI (headless scanner)
        id: cli
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust_target }}
          # `sitecmd gate` needs the connected-service endpoint at compile time.
          SITECMD_CONNECTED_ENDPOINT: "https://connect.sitecmd.com"
          # Reuse matrix-scoped platform signing material from the app build.
          APPLE_CERTIFICATE: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.target, 'darwin') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          AZURE_TENANT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'windows-x86_64' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGN_ENDPOINT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ENDPOINT || '' }}
          AZURE_SIGN_ACCOUNT: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_ACCOUNT || '' }}
          AZURE_SIGN_PROFILE: ${{ matrix.target == 'windows-x86_64' && vars.AZURE_SIGN_PROFILE || '' }}
        shell: bash
        run: bash .github/scripts/release/build-cli.sh
      - name: Save platform fragment
        env:
          TARGET: ${{ matrix.target }}
          FILENAME: ${{ steps.bundle.outputs.artifact_name }}
          DMG_NAME: ${{ steps.bundle.outputs.dmg_name }}
          CLI_ARCHIVE: ${{ steps.cli.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-info
          jq -n \
            --arg target "$TARGET" \
            --arg filename "$FILENAME" \
            --arg dmg_name "$DMG_NAME" \
            --arg cli_archive "$CLI_ARCHIVE" \
            '{target: $target, filename: $filename, cli_archive: $cli_archive}
              + (if $dmg_name != "" then {dmg_name: $dmg_name} else {} end)' \
            > "artifact-info/${TARGET}.json"

      - name: Stage unsigned release payload
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ steps.bundle.outputs.artifact }}
          DMG: ${{ steps.bundle.outputs.dmg }}
          CLI_ARCHIVE: ${{ steps.cli.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-staging/$TARGET"
          mkdir -p "$OUT"
          cp "$ARTIFACT" "$OUT/"
          if [ -n "$DMG" ]; then cp "$DMG" "$OUT/"; fi
          cp "$CLI_ARCHIVE" "${CLI_ARCHIVE}.sha256" "$OUT/"
          cp "artifact-info/${TARGET}.json" "$OUT/fragment.json"

          : > "$OUT/SHA256SUMS"
          for file in "$OUT"/*; do
            [ "$(basename "$file")" = "SHA256SUMS" ] && continue
            if command -v sha256sum >/dev/null 2>&1; then
              hash=$(sha256sum "$file" | awk '{print $1}')
            else
              hash=$(shasum -a 256 "$file" | awk '{print $1}')
            fi
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> "$OUT/SHA256SUMS"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-platform-${{ matrix.target }}
          path: release-staging/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1

  sign-updaters:
    name: Sign updater artifacts in isolation
    needs: [prepare-candidate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Expose only the updater key after human-approved builds complete.
    environment:
      name: release-updater-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-candidate.outputs.source_commit }}
          sparse-checkout: |
            .github/scripts/release
            .github/updater-signer
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: .github/updater-signer/package-lock.json

      - name: Provision the integrity-pinned standalone signer
        working-directory: .github/updater-signer
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: release-candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: unsigned-platform-*
          path: unsigned

      - name: Validate and stage signer inputs without secrets
        env:
          EXPECTED_CANDIDATE_HASH: ${{ needs.prepare-candidate.outputs.candidate_hash }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.prepare-candidate.outputs.source_commit }}
        shell: bash
        run: bash .github/scripts/release/stage-signer-inputs.sh
      - name: Sign exact updater and CLI bytes with the production key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing from release-updater-signing."
            exit 1
          fi
          SIGNER="$GITHUB_WORKSPACE/.github/updater-signer/node_modules/.bin/tauri"
          while IFS=$'\t' read -r target filename cli_archive; do
            "$SIGNER" signer sign "$GITHUB_WORKSPACE/signing-input/$target/$filename"
            "$SIGNER" signer sign "$GITHUB_WORKSPACE/signing-input/$target/$cli_archive"
          done < signing-plan.tsv
          # One checksum manifest for the whole release, signed by the same key.
          MANIFEST="$GITHUB_WORKSPACE/signing-input/SHA256SUMS"
          : > "$MANIFEST"
          record_hash() {
            printf '%s  %s\n' "$(sha256sum "$1" | awk '{print $1}')" "$(basename "$1")" >> "$MANIFEST"
          }
          while IFS=$'\t' read -r target filename cli_archive; do
            dir="$GITHUB_WORKSPACE/signing-input/$target"
            record_hash "$dir/$filename"
            record_hash "$dir/$cli_archive"
            dmg_name=$(jq -r '.dmg_name // empty' "$dir/fragment.json")
            if [ -n "$dmg_name" ]; then record_hash "$dir/$dmg_name"; fi
          done < signing-plan.tsv
          sort -k 2 -o "$MANIFEST" "$MANIFEST"
          "$SIGNER" signer sign "$MANIFEST"
          tr -d '\r' < "$MANIFEST.sig" | base64 --decode > "$MANIFEST.minisig"

      - name: Record signed payload provenance without secrets
        env:
          CANDIDATE_HASH: ${{ needs.prepare-candidate.outputs.candidate_hash }}
          SOURCE_COMMIT: ${{ needs.prepare-candidate.outputs.source_commit }}
        shell: bash
        run: bash .github/scripts/release/record-signed-payload.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-release-payload
          path: signed-release-payload/
          if-no-files-found: error
          retention-days: 1

  verify-release:
    name: Verify signed release (${{ matrix.target }})
    needs: [prepare-candidate, sign-updaters]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-universal
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2025-vs2026
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-candidate.outputs.source_commit }}
          sparse-checkout: |
            .github/scripts/release
            .github/updater-verifier
            apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build the minimal secretless verifier
        run: cargo build --release --locked --manifest-path .github/updater-verifier/Cargo.toml

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: release-candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-payload
          path: payload

      - name: Verify payload hashes, provenance, and updater signature
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_CANDIDATE_HASH: ${{ needs.prepare-candidate.outputs.candidate_hash }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.prepare-candidate.outputs.source_commit }}
        shell: bash
        run: bash .github/scripts/release/verify-signed-payload.sh
      - name: Verify Unix CLI and macOS platform signatures
        if: matrix.target != 'windows-x86_64'
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_VERSION: ${{ needs.prepare-candidate.outputs.version }}
        shell: bash
        run: bash .github/scripts/release/verify-unix-artifacts.sh
      - name: Verify Windows CLI and Authenticode signature
        if: matrix.target == 'windows-x86_64'
        env:
          EXPECTED_VERSION: ${{ needs.prepare-candidate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path "payload" "windows-x86_64"
          $fragment = Get-Content (Join-Path $dir "fragment.json") | ConvertFrom-Json
          $installer = Join-Path $dir $fragment.filename
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") {
            throw "Windows installer Authenticode status is $($signature.Status)"
          }
          New-Item -ItemType Directory -Path "cli-check" | Out-Null
          Expand-Archive (Join-Path $dir $fragment.cli_archive) "cli-check"
          foreach ($legalFile in @("LICENSE", "NOTICE", "THIRD_PARTY_NOTICES", "THIRD_PARTY_DEPENDENCIES.json", "THIRD_PARTY_LICENSES.txt", "THIRD_PARTY_LICENSES.tsv")) {
            $legalPath = Join-Path "cli-check" $legalFile
            if (!(Test-Path $legalPath) -or (Get-Item $legalPath).Length -eq 0) {
              throw "CLI archive is missing $legalFile"
            }
          }
          $cli = Join-Path "cli-check" "sitecmd.exe"
          $cliSignature = Get-AuthenticodeSignature $cli
          if ($cliSignature.Status -ne "Valid") {
            throw "Windows CLI Authenticode status is $($cliSignature.Status)"
          }
          if ($cliSignature.SignerCertificate.Thumbprint -ne $signature.SignerCertificate.Thumbprint) {
            throw "Windows CLI and installer signer certificates do not match"
          }
          $actual = & $cli --version
          if ($actual -ne "sitecmd $env:EXPECTED_VERSION") {
            throw "CLI version was '$actual'"
          }

  publish-release:
    name: Publish verified release
    needs: [prepare-candidate, verify-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      # Creating the GitHub Release needs write; the job still checks out nothing.
      contents: write
      # Sigstore provenance for the verified artifacts.
      id-token: write
      attestations: write
    # Publishing credentials are isolated from build and signer jobs.
    environment:
      name: release-publish
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: release-candidate

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-payload
          path: payload

      - name: Validate the verified tuple and prepare publication
        env:
          EXPECTED_CANDIDATE_HASH: ${{ needs.prepare-candidate.outputs.candidate_hash }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum release-candidate/manifest.json | awk '{print $1}')" = \
            "$EXPECTED_CANDIDATE_HASH"
          VERSION=$(jq -r '.version' release-candidate/manifest.json)
          NOTES=$(jq -r '.notes' release-candidate/manifest.json)
          PUB_DATE=$(jq -r '.pub_date' release-candidate/manifest.json)
          PLATFORMS="{}"
          DOWNLOADS="{}"
          mkdir -p publication
          : > publication/upload-plan.tsv

          safe_name() {
            printf '%s' "$1" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          }
          add_upload() {
            local_path=$1
            object_name=$2
            safe_name "$object_name"
            test -f "$local_path" && test ! -L "$local_path"
            hash=$(sha256sum "$local_path" | awk '{print $1}')
            printf '%s\t%s\t%s\n' "$local_path" "v${VERSION}/${object_name}" "$hash" \
              >> publication/upload-plan.tsv
          }

          count=0
          for fragment in payload/*/fragment.json; do
            dir=$(dirname "$fragment")
            (cd "$dir" && sha256sum -c SHA256SUMS)
            test "$(jq -r '.candidate_hash' "$fragment")" = "$EXPECTED_CANDIDATE_HASH"
            target=$(jq -r '.target' "$fragment")
            filename=$(jq -r '.filename' "$fragment")
            signature=$(jq -r '.signature' "$fragment")
            cli_archive=$(jq -r '.cli_archive' "$fragment")
            dmg_name=$(jq -r '.dmg_name // empty' "$fragment")
            safe_name "$filename"
            safe_name "$cli_archive"
            test "$(sha256sum "$dir/$filename" | awk '{print $1}')" = \
              "$(jq -r '.artifact_sha256' "$fragment")"
            case "$target" in
              darwin-universal) keys="darwin-aarch64 darwin-x86_64" ;;
              linux-x86_64|windows-x86_64) keys="$target" ;;
              *) echo "::error::Unexpected publication target: $target"; exit 1 ;;
            esac
            url="https://releases.sitecmd.com/v${VERSION}/${filename}"
            for key in $keys; do
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg t "$key" --arg s "$signature" --arg u "$url" \
                '. + {($t): {signature: $s, url: $u}}')
            done

            add_upload "$dir/$filename" "$filename"
            add_upload "$dir/$filename.sig" "$filename.sig"
            add_upload "$dir/$cli_archive" "$cli_archive"
            add_upload "$dir/$cli_archive.sig" "$cli_archive.sig"
            add_upload "$dir/${cli_archive}.sha256" "${cli_archive}.sha256"
            if [ -n "$dmg_name" ]; then
              safe_name "$dmg_name"
              add_upload "$dir/$dmg_name" "$dmg_name"
              DOWNLOADS=$(echo "$DOWNLOADS" | jq \
                --arg u "https://releases.sitecmd.com/v${VERSION}/${dmg_name}" \
                '. + {darwin: $u}')
            fi
            count=$((count + 1))
          done
          test "$count" -eq 3

          for required in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! echo "$PLATFORMS" | jq -e --arg t "$required" 'has($t)' >/dev/null; then
              echo "::error::Missing platform: $required"
              exit 1
            fi
          done
          if ! echo "$DOWNLOADS" | jq -e 'has("darwin")' >/dev/null; then
            echo "::error::Missing macOS first-install DMG."
            exit 1
          fi

          test -s payload/SHA256SUMS
          while read -r hash name; do
            grep -Fq "$(printf '\tv%s/%s\t%s' "$VERSION" "$name" "$hash")" publication/upload-plan.tsv
          done < payload/SHA256SUMS
          add_upload payload/SHA256SUMS SHA256SUMS
          add_upload payload/SHA256SUMS.sig SHA256SUMS.sig
          add_upload payload/SHA256SUMS.minisig SHA256SUMS.minisig
          {
            printf '%s\n\n' "$NOTES"
            echo "## Verify"
            echo
            echo "Installers and CLI archives are served from https://releases.sitecmd.com/v${VERSION}/. The attached SHA256SUMS and SHA256SUMS.minisig are signed with the SiteCMD updater key; verification steps are in the README section https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md#verify-your-download."
          } > publication/release-notes.md

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            --argjson downloads "$DOWNLOADS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms, downloads: $downloads}' \
            > publication/manifest.json
          jq '. | {version, pub_date, platforms: (.platforms | map_values(.url))}' \
            publication/manifest.json

      - name: Upload immutable release objects without executing them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          # The AWS CLI requires a region even when the endpoint is R2.
          AWS_DEFAULT_REGION: auto
          # Pin checksum behavior for R2 compatibility across runner-image upgrades.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          while IFS=$'\t' read -r local_path object_key expected_hash; do
            if aws s3api head-object --bucket sitecmd-releases --key "$object_key" \
                 --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
              existing=$(mktemp "$RUNNER_TEMP/sitecmd-existing.XXXXXX")
              aws s3 cp "s3://sitecmd-releases/$object_key" "$existing" \
                --endpoint-url "$ENDPOINT" >/dev/null
              actual_hash=$(sha256sum "$existing" | awk '{print $1}')
              rm -f "$existing"
              if [ "$actual_hash" != "$expected_hash" ]; then
                echo "::error::R2 object $object_key already exists with different bytes."
                exit 1
              fi
              echo "R2 object $object_key already matches the verified payload."
              continue
            fi
            aws s3 cp "$local_path" "s3://sitecmd-releases/$object_key" \
              --endpoint-url "$ENDPOINT"
          done < publication/upload-plan.tsv

      - name: Advance the production updater manifest
        env:
          RELEASE_ADMIN_KEY: ${{ secrets.RELEASE_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -sS -X POST \
            -H "Authorization: Bearer ${RELEASE_ADMIN_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @publication/manifest.json \
            https://releases.sitecmd.com/api/releases-admin

      - name: Publish the GitHub Release with notes and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The updater manifest already advanced, so clients are offered this
          # version before the Release exists. An existing Release is repaired
          # rather than left as it is.
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
               --json isDraft,assets > release-state.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release-state.json)" = "true" ]; then
              echo "::error::Release $TAG_NAME is a draft while clients are already offered $VERSION. Publish or delete it, then re-run publish-release."
              exit 1
            fi
            for asset in SHA256SUMS SHA256SUMS.minisig; do
              if jq -e --arg name "$asset" '.assets | any(.name == $name)' release-state.json >/dev/null; then
                continue
              fi
              echo "Release $TAG_NAME is missing $asset; attaching it."
              gh release upload "$TAG_NAME" "payload/$asset" \
                --repo "$GITHUB_REPOSITORY" --clobber
            done
            echo "GitHub Release $TAG_NAME exists with both checksum assets attached."
            exit 0
          fi
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SiteCMD $VERSION" \
            --notes-file publication/release-notes.md \
            payload/SHA256SUMS payload/SHA256SUMS.minisig

      - name: Attest build provenance for the published artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            payload/*/*.tar.gz
            payload/*/*.AppImage
            payload/*/*-setup.exe
            payload/*/*.zip
            payload/*/*.dmg
            payload/SHA256SUMS

      - name: Smoke test the public release surface
        env:
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Every planned object must be publicly served with exactly the
          # bytes the plan hashed, and update discovery must answer for every
          # shipped OS, before the run may go green. The User-Agent announces
          # this probe so the releases worker keeps it out of download and
          # update-check analytics.
          SMOKE_UA="SiteCMD-Release-Smoke/1"
          fail=0
          while IFS=$'\t' read -r _ object_key expected_hash; do
            url="https://releases.sitecmd.com/${object_key}"
            got=$(curl -fsSL -A "$SMOKE_UA" --retry 5 --retry-delay 3 "$url" | sha256sum | awk '{print $1}') \
              || got="fetch-failed"
            if [ "$got" != "$expected_hash" ]; then
              echo "::error::${url} served ${got}, expected ${expected_hash}"
              fail=1
            fi
          done < publication/upload-plan.tsv
          latest=$(curl -fsSL -A "$SMOKE_UA" --retry 5 --retry-delay 3 https://releases.sitecmd.com/ \
            | jq -r '.latest_version')
          if [ "$latest" != "$VERSION" ]; then
            echo "::error::Worker reports latest_version ${latest}, expected ${VERSION}"
            fail=1
          fi
          # The desktop updater substitutes the OS alone into
          # /{{target}}/{{current_version}}: an out-of-date client must be
          # offered this version with its platform keys, a current one 204.
          for target in darwin linux windows; do
            case "$target" in
              darwin) keys="darwin-aarch64 darwin-x86_64" ;;
              linux) keys="linux-x86_64" ;;
              windows) keys="windows-x86_64" ;;
            esac
            manifest=$(curl -fsSL -A "$SMOKE_UA" --retry 5 --retry-delay 3 \
              "https://releases.sitecmd.com/${target}/0.0.0") || manifest=""
            offered=$(printf '%s' "$manifest" | jq -r '.version' 2>/dev/null || echo "none")
            if [ "$offered" != "$VERSION" ]; then
              echo "::error::/${target}/0.0.0 offers ${offered}, expected ${VERSION}"
              fail=1
            fi
            for key in $keys; do
              if ! printf '%s' "$manifest" | jq -e --arg k "$key" \
                   '.platforms | has($k)' >/dev/null 2>&1; then
                echo "::error::/${target}/0.0.0 is missing platform ${key}"
                fail=1
              fi
            done
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A "$SMOKE_UA" --retry 5 --retry-delay 3 \
              "https://releases.sitecmd.com/${target}/${VERSION}")
            if [ "$code" != "204" ]; then
              echo "::error::/${target}/${VERSION} returned ${code}, expected 204 no-update"
              fail=1
            fi
          done
          exit "$fail"

  publish-npm:
    name: Publish the CLI to npm
    needs: [prepare-candidate, publish-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm publish --provenance attests the publication through GitHub OIDC.
      id-token: write
    environment:
      name: release-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-release-payload
          path: payload
      - name: Publish the verified binaries as @sitecmd/cli
        env:
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: bash .github/scripts/release/publish-npm-packages.sh
