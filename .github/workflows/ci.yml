name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Install actionlint
        env:
          # The linux_amd64 line of the release's
          # actionlint_<version>_checksums.txt.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 actionlint "${RUNNER_TEMP}/bin/actionlint"
          rm -f actionlint actionlint.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/actionlint" -version
      - name: Lint
        run: pnpm run lint
      - name: Formatting
        run: pnpm exec prettier --check .
      - name: Check legal artifacts
        run: pnpm run legal:check
      - name: Check CLI installers
        run: pnpm run installer:check
      - name: Check workflow syntax
        run: pnpm run workflows:check
      - name: Check repository guardrails
        run: pnpm run guardrails:repo
      - name: Check unused export budget
        run: pnpm run knip:exports-budget
      - name: Check unused files and dependencies
        run: pnpm run knip:files
      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check --all
      - name: Check the Rust toolchain
        run: node tools/scripts/audit/check-rust-toolchain.mjs
      - name: Check Rust patterns
        run: bash tools/scripts/audit/forbid-adhoc-rust-patterns.sh
      - name: Install gitleaks
        env:
          # The checksum is the linux_x64 line of the release's
          # gitleaks_<version>_checksums.txt; bump both together.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          rm -f gitleaks gitleaks.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      # Scan the PR or queue range. A manual run scans the checked-out history.
      - name: Scan commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi
          gitleaks git --redact --no-banner --config=.gitleaks.toml --log-opts="${range}"
      - name: Check AGENTS.md
        run: node tools/scripts/audit/check-agents-md.mjs
      - name: Audit regex safety
        run: pnpm run audit:regex
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.19.4
      - name: Check dependency policy and fixture
        run: pnpm run audit:deps:rust-policy --no-advisories
      - name: Check licenses and sources with all features
        working-directory: apps/desktop/src-tauri
        run: cargo deny --all-features check licenses sources
      - name: Check bans across all workspace features
        working-directory: apps/desktop/src-tauri
        run: cargo deny --all-features --workspace check bans
      - name: Check budget ratchet and guide triggers
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          message_args=()
          guide_message_args=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            message_dir=$(mktemp -d)
            trap 'rm -f "$message_dir/budget" "$message_dir/guide"; rmdir "$message_dir"' EXIT
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$message_dir/budget"
            printf '%s\n' "$PR_BODY" > "$message_dir/guide"
            message_args=(--message-file "$message_dir/budget")
            guide_message_args=(--message-file "$message_dir/guide")
          elif [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_SHA")
          fi
          node tools/scripts/check-budget-ratchet.mjs --range "${BASE_SHA}..${HEAD_SHA}" "${message_args[@]}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            node tools/scripts/audit/check-agents-md.mjs --range "${BASE_SHA}..${HEAD_SHA}" "${guide_message_args[@]}"
          fi

  pr-title:
    name: PR title and body
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check pull request title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          body_file=$(mktemp)
          printf '%s' "$PR_BODY" > "$body_file"
          node tools/scripts/pr-title.mjs --title="$PR_TITLE" --body-file "$body_file" --author "$PR_AUTHOR"

  public-tree:
    name: Public tree
    # Only the public repository must stay free of engine code.
    if: github.event_name == 'pull_request' && github.repository == 'brambleworks/SiteCMD-Local'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read base Node version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:.nvmrc" > "$RUNNER_TEMP/public-tree.nvmrc"

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ runner.temp }}/public-tree.nvmrc

      - name: Check public trees
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          selector=tools/scripts/run-public-tree-check.mjs
          selector_dir="$(mktemp -d "$RUNNER_TEMP/public-tree-selector.XXXXXX")"
          selector_file="$selector_dir/selector.mjs"
          base_files="$(git ls-tree --name-only "$BASE_SHA" -- "$selector" \
            tools/scripts/check-publication-history.mjs \
            tools/scripts/lib/publication-history-rules.mjs \
            tools/scripts/lib/toml-fields.mjs)"
          source_sha="$BASE_SHA"
          if ! printf '%s\n' "$base_files" | grep -qxF "$selector"; then
            source_sha="$HEAD_SHA"
          elif [ "$(printf '%s\n' "$base_files" | wc -l)" -ne 4 ]; then
            echo "Base commit has an incomplete public tree guard." >&2
            exit 2
          fi
          git show "$source_sha:$selector" > "$selector_file"
          node "$selector_file" "$BASE_SHA" "$HEAD_SHA"

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        env:
          # zizmor publishes no checksum file. This is the SHA-256 digest
          # GitHub lists for the release's x86_64-unknown-linux-gnu archive,
          # and the one its build provenance attestation signs
          # (`gh attestation verify <archive> -R zizmorcore/zizmor`).
          ZIZMOR_VERSION: "1.30.1"
          ZIZMOR_SHA256: "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a"
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --retry 3 \
            --output zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf zizmor.tar.gz zizmor
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 zizmor "${RUNNER_TEMP}/bin/zizmor"
          rm -f zizmor zizmor.tar.gz
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/zizmor" --version
      - name: Audit workflows and actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .

  dependency-paths:
    name: Dependency paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            dependencies:
              - "**/Cargo.lock"
              - "**/Cargo.toml"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "THIRD_PARTY_DEPENDENCIES.json"
              - "tools/scripts/audit-rust-deps.mjs"
              - ".github/updater-signer/package-lock.json"
              - ".github/updater-signer/package.json"
              - "**/package.json"
              - "**/deny.toml"

  dependency-audit:
    name: Dependency advisories
    if: needs.dependency-paths.outputs.dependencies == 'true' || github.event_name == 'workflow_dispatch'
    needs: dependency-paths
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit@0.22.1
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.19.4
      - name: Audit Rust dependency advisories
        env:
          SITECMD_RUST_AUDIT_FETCH: "1"
        run: pnpm run audit:deps:rust
      - name: Audit JavaScript dependency advisories
        run: pnpm run audit:deps:js
      - name: Audit updater signer advisories
        run: pnpm run audit:deps:signer
      - name: Check Rust advisory policy
        working-directory: apps/desktop/src-tauri
        run: cargo deny --all-features check advisories

  cli-build-smoke:
    name: Build and smoke-test the headless CLI
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Build the headless CLI
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked --manifest-path crates/cli/Cargo.toml
      - name: Run stand-in smoke tests
        run: node tools/scripts/cli-smoke.mjs --standin

  cli-linux-arm64:
    name: Build and smoke-test the Linux arm64 CLI
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Build and run the headless CLI
        working-directory: apps/desktop/src-tauri
        run: |
          cargo build --locked --manifest-path crates/cli/Cargo.toml
          target/debug/sitecmd_cli --version

  guardrails-tests:
    name: Repository guardrail tests
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned minisign
        run: bash .github/scripts/install-minisign.sh
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Repository guardrail tests
        run: pnpm run guardrails:repo:test

  rust-tests:
    name: Public Rust tests and clippy
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Test the public Rust packages
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --no-fail-fast -p sitecmd-protocol -p sitecmd-engine-host -p sitecmd-engine-standin -p sitecmd-runtime -p sitecmd-cli
      - name: Lint the public Rust packages
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -p sitecmd-protocol -p sitecmd-engine-host -p sitecmd-engine-standin -p sitecmd-runtime -p sitecmd-cli -- -D warnings

  cli-headless-clippy:
    name: Headless CLI clippy
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Headless CLI clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --manifest-path crates/cli/Cargo.toml --all-targets -- -D warnings

  doctest:
    name: Workspace Rust doctests
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Free runner disk for Rust build outputs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Workspace Rust doctests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --doc --workspace

  msrv:
    name: Rust 1.95 compatibility
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SITECMD_ENGINE_WASM: ${{ github.workspace }}/apps/desktop/src-tauri/target/standin/sitecmd_engine_standin.wasm
      SITECMD_ENGINE_UNPINNED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        working-directory: apps/desktop/src-tauri
        run: |
          rustc --version
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Free runner disk for Rust build outputs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: ci-dependencies
          save-if: false
      - name: Fetch locked Cargo dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo fetch --locked
      - name: Use the runner CPU count
        run: |
          runner_cpus=$(node -p 'require("node:os").availableParallelism()')
          printf 'CARGO_BUILD_JOBS=%s\nVITEST_MAX_WORKERS=%s\n' "$runner_cpus" "$runner_cpus" >> "$GITHUB_ENV"
      - name: Build the stand-in engine
        run: node tools/scripts/build-standin.mjs
      - name: Install the Rust MSRV
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Check workspace MSRV
        working-directory: apps/desktop/src-tauri
        run: cargo +1.95.0 check --locked --workspace --all-targets
      - name: Check headless CLI MSRV
        working-directory: apps/desktop/src-tauri
        run: cargo +1.95.0 check --locked --manifest-path crates/cli/Cargo.toml --all-targets

  codeql:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - "**/fixtures/**"
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  CI:
    name: CI
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - static
      - pr-title
      - public-tree
      - workflow-lint
      - dependency-paths
      - dependency-audit
      - cli-build-smoke
      - cli-linux-arm64
      - guardrails-tests
      - rust-tests
      - cli-headless-clippy
      - doctest
      - msrv
      - codeql
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ !(github.event_name == 'pull_request') && 'pr-title' || '' }},
            ${{ !(github.event_name == 'pull_request' && github.repository == 'brambleworks/SiteCMD-Local') && 'public-tree' || '' }},
            ${{ !(needs.dependency-paths.outputs.dependencies == 'true' || github.event_name == 'workflow_dispatch') && 'dependency-audit' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'cli-build-smoke' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'cli-linux-arm64' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'guardrails-tests' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'rust-tests' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'cli-headless-clippy' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'doctest' || '' }},
            ${{ !(github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 'msrv' || '' }}
